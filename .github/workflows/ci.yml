name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: no third-party tracing from transitive LangChain dependencies.
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope-ci-only
          POSTGRES_DB: agentscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentscope"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTSCOPE_TEST_POSTGRES_URL: postgresql+psycopg://agentscope:agentscope-ci-only@127.0.0.1:5432/agentscope_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      # Gates the deterministic fake-model suites (dataset, gate.json and per-version
      # baseline in each directory, by the loader's naming convention). Exit codes:
      # 1 gate failed, 2 invalid fixtures, 3 harness error; any of them fails the job.
      - name: Gate research assistant
        run: >-
          uv run agentscope eval --dataset tests/fixtures --agent research_assistant@v2
          --check --no-save --json > gate-research.json
      - name: Gate task planner
        run: >-
          uv run agentscope eval --dataset tests/fixtures/planner --agent task_planner@v2
          --check --no-save --json > gate-planner.json
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-results
          path: gate-*.json
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the dashboard, seeds the demo story into a throwaway
      # database and serves it on 127.0.0.1:8799; the specs talk to nothing else.
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: docker buildx build --load --tag agentscope:ci .
      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: dummy-ci-password-not-a-secret
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ollama.yml config --quiet
      # SQLite in the image's /data volume, hardened as in docker-compose.yml, published on
      # the runner's loopback only. tests/fixtures holds the CI gate inputs.
      - name: Start
        run: >-
          docker run --detach --name agentscope
          --publish 127.0.0.1:8765:8765
          --read-only --tmpfs /tmp
          --cap-drop ALL --security-opt no-new-privileges:true
          --volume "$PWD/tests/fixtures:/fixtures:ro"
          agentscope:ci
      - name: Wait until healthy
        run: |
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' agentscope)" = healthy ]; then
              curl --fail --silent --show-error http://127.0.0.1:8765/api/health
              exit 0
            fi
            sleep 2
          done
          echo "the container never became healthy" >&2
          exit 1
      - name: Check exposure
        run: |
          # The dashboard is served through the published loopback port...
          curl --fail --silent http://127.0.0.1:8765/overview | grep -q '<div id="app">'
          # ...any other Host header is refused (DNS rebinding, LAN or container-network access)...
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: attacker.example' http://127.0.0.1:8765/api/health)
          test "$status" = 400
          # ...and the server runs as the unprivileged user.
          test "$(docker exec agentscope id -u)" = 10001
      # The packaged dataset under the quality-gate thresholds and v2's baseline (the fixture
      # dataset is a byte-for-byte copy of it). Without them, --check requires every case to
      # pass, and v2 deliberately fails 8 of 29 (see tests/fixtures/README.md).
      - name: Evaluate inside the container
        run: >-
          docker exec agentscope agentscope eval
          --dataset research-assistant --agent research_assistant@v2 --check --no-save
          --thresholds /fixtures/gate.json
          --baseline /fixtures/research_assistant@v2.baseline.json
      - name: Container logs
        if: always()
        run: docker logs agentscope || true
