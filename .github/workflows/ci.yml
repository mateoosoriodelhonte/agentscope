name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: no third-party tracing from transitive LangChain dependencies.
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope-ci-only
          POSTGRES_DB: agentscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentscope"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTSCOPE_TEST_POSTGRES_URL: postgresql+psycopg://agentscope:agentscope-ci-only@127.0.0.1:5432/agentscope_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      # Gates the deterministic fake-model suite in tests/fixtures (dataset files, gate.json
      # and baselines, by the loader's naming convention). Exit codes: 1 gate failed,
      # 2 invalid fixtures, 3 harness error; any of them fails the job.
      - name: Evaluate
        run: uv run agentscope eval --dataset tests/fixtures --check --no-save --json > gate-result.json
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-result
          path: gate-result.json
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
